<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060A12">
<title>SECURIAN — V1.2</title>
<style>
:root{--gold:#f3b51b;--navy:#102f68;--bg:#060a12;--card:#101722;--line:#1b2635;--text:#f7f9fc;--muted:#94a0b5;--ok:#65d89a;--danger:#ff6b6b;--warn:#ffc857}
*{box-sizing:border-box}body{margin:0;background:#03060b;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:82px}
.header{padding:16px 18px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(6,10,18,.96);backdrop-filter:blur(10px);z-index:10}
.logo{width:48px;height:48px;object-fit:contain}.brand{font-size:20px;font-weight:900;letter-spacing:2px}.tag{font-size:8px;color:#b7c0cf;letter-spacing:1px;margin-top:2px}
.content{padding:18px}.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:1.3px}.h1{font-size:27px;font-weight:850;margin:4px 0 4px}.muted{color:var(--muted);font-size:13px;line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px}.stat .num{font-size:27px;font-weight:900;margin:7px 0 2px}.stat .label{color:var(--muted);font-size:12px}
.section{font-size:18px;font-weight:800;margin:24px 0 10px}.card{margin-bottom:12px}.title{font-size:16px;font-weight:800;margin-bottom:5px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
button,.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:800;cursor:pointer}.field{width:100%;background:#0b111b;color:#fff;border:1px solid #2a3748;border-radius:11px;padding:13px;font-size:14px;outline:none}.field:focus{border-color:var(--gold)}.primary{background:var(--gold);color:#07101e}.darkbtn{background:var(--navy);color:#fff}.outline{background:transparent;color:#fff;border:1px solid #3a4658}.danger{background:#5b1f27;color:#ffd9dd}.badge{padding:7px 9px;border-radius:8px;font-size:10px;font-weight:900}.ok{background:#173d2d;color:var(--ok)}.warn{background:#4b3a12;color:var(--warn)}.bad{background:#4b1d24;color:#ff8c95}
.list{display:flex;flex-direction:column;gap:9px}.item{background:#0c121c;border:1px solid var(--line);border-radius:13px;padding:13px}.itemtop{display:flex;justify-content:space-between;gap:10px}.item strong{font-size:14px}.small{font-size:12px;color:var(--muted);margin-top:4px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:rgba(9,14,23,.98);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.nav button{background:transparent;color:#aeb8c8;border-radius:0;padding:10px 4px 9px;font-size:10px}.nav button.active{color:var(--gold)}.nav .ico{font-size:19px;display:block;margin-bottom:3px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.loginbox{width:100%;max-width:390px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:25px;box-shadow:0 20px 60px #0008}.loginbox img{width:120px;height:120px;display:block;margin:0 auto 12px;object-fit:contain}.loginbox h1{text-align:center;margin:0 0 4px}.loginbox p{text-align:center;color:var(--muted);font-size:13px}.field{margin-top:14px}.field label{display:block;color:#c9d1df;font-size:12px;margin-bottom:6px}.field input,.field select{width:100%;padding:13px;border-radius:11px;border:1px solid #2b3748;background:#080d15;color:#fff;font-size:15px}.demo{margin-top:14px;font-size:11px;color:var(--muted);line-height:1.6}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#172333;border:1px solid #304057;padding:10px 14px;border-radius:12px;display:none;z-index:30;font-size:12px}
.hidden{display:none!important}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:10px}.modalbox{width:min(520px,100%);max-height:88vh;overflow:auto;background:#0d1420;border:1px solid #2a3748;border-radius:20px;padding:18px;box-shadow:0 20px 80px rgba(0,0,0,.5)}.formgrid{display:flex;flex-direction:column;gap:9px;margin-top:14px}textarea.field{resize:vertical}.danger{background:#3a171c;color:#ff8f8f;border:1px solid #74313a}.small{font-size:12px;color:var(--muted);line-height:1.45}
</style>
</head>

function cardDays(dateStr){
 if(!dateStr)return null;
 const d=new Date(dateStr+"T23:59:59");
 if(Number.isNaN(d.getTime()))return null;
 return Math.ceil((d-new Date())/86400000);
}
function cardBadge(dateStr){
 const n=cardDays(dateStr);
 if(n===null)return {label:"Non renseignée",cls:"warn"};
 if(n<0)return {label:"EXPIRÉE",cls:"danger"};
 if(n<=90)return {label:`${n} j`,cls:"warn"};
 return {label:"VALIDE",cls:"ok"};
}
function cardReminder(dateStr){
 const n=cardDays(dateStr);
 return n!==null && n>=0 && n<=90;
}

function shiftDuration(s,e){
 let [h1,m1]=s.split(":").map(Number),[h2,m2]=e.split(":").map(Number);
 let a=h1*60+m1,b=h2*60+m2;if(b<=a)b+=1440;
 return (b-a)/60;
}
function overlap(a,b){
 const startA=new Date(a.date+"T"+a.start),endA=new Date(a.date+"T"+a.end);
 if(endA<=startA)endA.setDate(endA.getDate()+1);
 const startB=new Date(b.date+"T"+b.start),endB=new Date(b.date+"T"+b.end);
 if(endB<=startB)endB.setDate(endB.getDate()+1);
 return startA<endB&&startB<endA;
}
function variableCalc(sh){
 const dur=shiftDuration(sh.start,sh.end);
 let [h,m]=sh.start.split(":").map(Number), [eh,em]=sh.end.split(":").map(Number);
 let start=h*60+m,end=eh*60+em;if(end<=start)end+=1440;
 let night=0;
 for(let x=start;x<end;x++){
   let minute=x%1440;
   if(minute>=21*60||minute<6*60)night+=1;
 }
 const date=new Date(sh.date+"T12:00:00");
 const sunday=date.getDay()===0;
 const holidays=["2026-01-01","2026-04-06","2026-05-01","2026-05-08","2026-05-14","2026-05-25","2026-07-14","2026-08-15","2026-11-01","2026-11-11","2026-12-25"];
 const holiday=holidays.includes(sh.date);
 return {hours:dur,night:night/60,sunday,holiday,panier:dur>=6?1:0,habillageHours:dur*(10/60)};
}
function createShift(){
 if(!requireDirection())return;
 const date=esc(document.getElementById("shiftDate").value),start=esc(document.getElementById("shiftStart").value),end=esc(document.getElementById("shiftEnd").value),siteId=Number(document.getElementById("shiftSite").value),agentId=Number(document.getElementById("shiftAgent").value)||null;
 if(!date||!start||!end||!siteId){toast("Date, horaires et site obligatoires");return}
 const sh={id:Date.now(),date,start,end,siteId,agentId,status:agentId?"Affecté":"À pourvoir",proposals:[]};
 if(agentId){
   const conflict=shiftsData.some(x=>x.agentId===agentId&&overlap(x,sh));
   if(conflict){toast("Conflit horaire pour cet agent");return}
 }
 shiftsData.push(sh);savePlanning();state.modal=null;toast("Vacation créée");render();
}
function compatibleAgents(sh){
 return agentsData.filter(a=>{
   if(a.status!=="Actif")return false;
   if(cardDays(a.cardExpiry)!==null&&cardDays(a.cardExpiry)<0)return false;
   if(a.site && !a.site.includes((sitesData.find(s=>s.id===sh.siteId)||{}).name||""))return false;
   return !shiftsData.some(x=>x.agentId===a.id&&overlap(x,sh));
 });
}
function proposeShift(id){
 if(!requireDirection())return;
 const sh=shiftsData.find(x=>x.id===id);if(!sh)return;
 const list=compatibleAgents(sh);
 if(!list.length){toast("Aucun agent compatible trouvé");return}
 list.forEach(a=>{if(!proposalsData.some(p=>p.shiftId===id&&p.agentId===a.id))proposalsData.push({id:Date.now()+a.id,shiftId:id,agentId:a.id,status:"En attente",createdAt:new Date().toISOString()})});
 sh.status="Propositions envoyées";savePlanning();toast(list.length+" agent(s) ont reçu une proposition");render();
}
function acceptProposal(pid){
 const pr=proposalsData.find(p=>p.id===pid);if(!pr)return;
 const sh=shiftsData.find(s=>s.id===pr.shiftId);if(!sh)return;
 const conflict=shiftsData.some(x=>x.id!==sh.id&&x.agentId===pr.agentId&&overlap(x,sh));
 if(conflict){toast("Conflit horaire : prestation indisponible");return}
 pr.status="Acceptée";sh.status="En attente de validation";sh.agentId=pr.agentId;
 proposalsData.filter(p=>p.shiftId===sh.id&&p.id!==pid).forEach(p=>p.status="Refusée");
 savePlanning();toast("Prestation acceptée");render();
}
function rejectProposal(pid){
 const pr=proposalsData.find(p=>p.id===pid);if(pr){pr.status="Refusée";savePlanning();toast("Proposition refusée");render()}
}
function validateShift(id){
 if(!requireDirection())return;
 const sh=shiftsData.find(s=>s.id===id);if(!sh||!sh.agentId)return;
 sh.status="Affecté";savePlanning();toast("Vacation validée");render();
}

}

function submitClient(){
 if(!requireDirection())return;
 const name=esc(document.getElementById("clientName").value.trim()),contact=esc(document.getElementById("clientContact").value.trim()),phone=esc(document.getElementById("clientPhone").value.trim()),email=esc(document.getElementById("clientEmail").value.trim());
 if(!name){toast("Nom du client obligatoire");return}
 const obj={id:Date.now(),name,contact,phone,email,status:"Actif"};
 if(state.editType==="client"&&state.editIndex!=null)clientsData[state.editIndex]={...clientsData[state.editIndex],...obj,id:clientsData[state.editIndex].id};
 else clientsData.push(obj);
 state.modal=null;state.editType=null;state.editIndex=null;saveData();toast("Client enregistré");render();
}
function clients(){
 if(!canManage())return `<div class="eyebrow">CLIENTS</div><div class="h1">Clients</div><div class="muted">Accès réservé à la Direction.</div>`;
 return `<div class="eyebrow">COMMERCIAL</div><div class="h1">Clients</div><div class="muted">Créez vos clients puis rattachez leurs sites.</div><button class="primary" style="width:100%;margin-top:14px" onclick="openClient()">➕ CRÉER UN CLIENT</button><div class="section">${clientsData.length} client(s)</div><div class="list">${clientsData.map((c,i)=>`<div class="item"><div class="itemtop"><strong>👤 ${esc(c.name)}</strong><span class="badge ok">${esc(c.status)}</span></div><div class="small">${c.contact?esc(c.contact)+" • ":""}${c.phone?"📞 "+esc(c.phone):""} ${c.email?"• ✉️ "+esc(c.email):""}</div><div class="small">🏢 ${sitesData.filter(s=>Number(s.clientId)===c.id).length} site(s)</div><div class="row"><button class="outline" onclick="editClient(${i})">Modifier</button><button class="danger" onclick="removeClient(${i})">Supprimer</button></div></div>`).join("")}</div>`
}
function sites(){
const can=canManage();
return `<div class="eyebrow">OPÉRATIONS</div><div class="h1">Sites</div><div class="muted">Créez vos sites clients, leurs adresses et leurs consignes.</div>
${can?`<button class="primary" style="width:100%;margin-top:14px" onclick="openCreate('site')">➕ CRÉER UN SITE</button>`:""}
<div class="section">${sitesData.length} site(s)</div><div class="list">${sitesData.map((x,i)=>`<div class="item"><div class="itemtop"><strong>🏢 ${esc(x.name)} — ${esc(x.city)}</strong><span class="badge ok">${esc(x.status)}</span></div><div class="small">👤 Client : ${esc((clientsData.find(c=>c.id===Number(x.clientId))||{}).name||"Non renseigné")}</div><div class="small">${esc(x.type)} • ${esc(x.address||"Adresse non renseignée")}</div><div class="small" style="margin-top:7px">📋 ${esc(x.instructions||"Aucune consigne renseignée")}</div><div class="row"><button class="darkbtn" onclick="waze('${esc(x.address||x.name+" "+x.city)}')">🧭 Waze</button>${can?`<button class="outline" onclick="editSite(${i})">Modifier</button><button class="danger" onclick="removeSite(${i})">Supprimer</button>`:""}</div></div>`).join("")}</div>`}
function agents(){
const can=canManage();
return `<div class="eyebrow">RESSOURCES HUMAINES</div><div class="h1">${state.role==="sous"?"Mes agents":"Agents"}</div><div class="muted">Fiches agents, carte professionnelle, coordonnées et affectations.</div>
${can?`<button class="primary" style="width:100%;margin-top:14px" onclick="openCreate('agent')">➕ CRÉER UN AGENT</button>`:""}
<div class="section">${agentsData.length} agent(s)</div><div class="list">${agentsData.map((x,i)=>`<div class="item"><div class="itemtop"><strong>👮 ${esc(x.first)} ${esc(x.last)}</strong><span class="badge ${cardBadge(x.cardExpiry).cls}">${cardBadge(x.cardExpiry).label}</span></div><div class="small">${esc(x.type)} • ${esc(x.status)}</div><div class="small">🪪 N° ${esc(x.cardNumber||"Non renseigné")} • Fin de validité : ${x.cardExpiry?esc(new Date(x.cardExpiry+"T00:00:00").toLocaleDateString("fr-FR")):"Non renseignée"}</div><div class="small">${x.phone?"📞 "+esc(x.phone):"📞 Non renseigné"} • ${x.email?"✉️ "+esc(x.email):"✉️ Non renseigné"}</div><div class="small">🏢 ${esc(x.site||"Aucun site affecté")}</div>${can?`<div class="row"><button class="outline" onclick="editAgent(${i})">Modifier</button><button class="danger" onclick="removeAgent(${i})">Supprimer</button></div>`:""}</div>`).join("")}</div>`}
function createAccount(){
const name=document.getElementById("accName").value.trim();
const email=document.getElementById("accEmail").value.trim();
const role=document.getElementById("accRole").value;
const password=document.getElementById("accPassword").value.trim();
if(!name||!email||!password){toast("Veuillez remplir tous les champs");return}
const labels={cadre:"CADRE",salarie:"AGENT SECURIAN",sous:"SOUS-TRAITANT",agentext:"AGENT SOUS-TRAITANT"};
accounts.push({name,email,password,role,roleLabel:labels[role]});
localStorage.setItem("securian_accounts",JSON.stringify(accounts));
toast("Compte créé avec succès");
render();
}
function deleteAccount(i){
if(!confirm("Supprimer ce compte ?")) return;
accounts.splice(i,1);
localStorage.setItem("securian_accounts",JSON.stringify(accounts));
render();
}

function subDocKey(subId,doc){return String(subId)+"::"+doc}
function subDocStatus(subId,doc){return !!subDocsData[subDocKey(subId,doc)]}
function toggleSubDoc(subId,doc){
 if(!requireDirection())return;
 const k=subDocKey(subId,doc);
 if(subDocsData[k]) delete subDocsData[k]; else subDocsData[k]={uploadedAt:new Date().toISOString()};
 saveData();render();
}
function openSubDetail(i){
 if(!requireDirection())return;
 state.modal="subdetail";state.editIndex=i;render();
}
function openCreateSubAgent(subId){
 if(!requireDirection())return;
 state.modal="subagent";state.editIndex=null;state.subId=subId;render();
}
function assignSubAgent(agentId){
 if(!requireDirection())return;
 const a=subAgentsData.find(x=>x.id===agentId); if(!a)return;
 state.modal="assignsub";state.subAgentId=agentId;render();
}
function saveSubAgent(){
 if(!requireDirection())return;
 const subId=Number(document.getElementById("subAgentSub").value), first=esc(document.getElementById("subAgentFirst").value.trim()), last=esc(document.getElementById("subAgentLast").value.trim()), phone=esc(document.getElementById("subAgentPhone").value.trim()), email=esc(document.getElementById("subAgentEmail").value.trim()), cardNumber=esc(document.getElementById("subAgentCard").value.trim()), cardExpiry=esc(document.getElementById("subAgentExpiry").value);
 if(!first||!last||!cardNumber||!cardExpiry){toast("Nom, prénom, carte et échéance sont obligatoires");return}
 subAgentsData.push({id:Date.now(),subId,first,last,phone,email,cardNumber,cardExpiry,status:"Actif",sites:[]});
 const s=subcontractorsData.find(x=>x.id===subId); if(s)s.agents=subAgentsData.filter(a=>a.subId===subId).length;
 state.modal=null;saveData();toast("Agent sous-traitant créé");render();
}
function saveSubAssignment(){
 if(!requireDirection())return;
 const a=subAgentsData.find(x=>x.id===state.subAgentId); if(!a)return;
 const checks=[...document.querySelectorAll('input[name="subSite"]:checked')].map(x=>Number(x.value));
 a.sites=checks;state.modal="subdetail";saveData();toast("Affectations enregistrées");render();
}
function removeSubAgent(id){
 if(!requireDirection())return;
 if(!confirm("Retirer cet agent du sous-traitant ?"))return;
 subAgentsData=subAgentsData.filter(a=>a.id!==id);
 subcontractorsData.forEach(s=>s.agents=subAgentsData.filter(a=>a.subId===s.id).length);
 saveData();render();
}
function subDetailHTML(){
 const s=subcontractorsData[state.editIndex]; if(!s)return "";
 const docs=SUB_DOCS.map(d=>`<div class="item"><div class="itemtop"><strong>📄 ${esc(d)}</strong><span class="badge ${subDocStatus(s.id,d)?"ok":"danger"}">${subDocStatus(s.id,d)?"FOURNI":"MANQUANT"}</span></div><div class="row"><button class="${subDocStatus(s.id,d)?"outline":"primary"}" onclick="toggleSubDoc(${s.id},'${esc(d)}')">${subDocStatus(s.id,d)?"Marquer manquant":"Document reçu"}</button></div></div>`).join("");
 const agents=subAgentsData.filter(a=>a.subId===s.id);
 return `<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><div class="itemtop"><div class="title">🤝 ${esc(s.name)}</div><button class="outline" onclick="closeModal()">✕</button></div>
 <div class="pillbar"><span class="pill sel">Documents</span><span class="pill">Salariés</span></div>
 <div class="section">Documents obligatoires</div><div class="list">${docs}</div>
 <div class="section">Salariés / agents du sous-traitant</div><button class="primary" style="width:100%;margin-bottom:10px" onclick="openCreateSubAgent(${s.id})">➕ AJOUTER UN AGENT</button>
 <div class="list">${agents.length?agents.map(a=>`<div class="item"><div class="itemtop"><strong>👷 ${esc(a.first)} ${esc(a.last)}</strong><span class="badge ok">${esc(a.status)}</span></div><div class="small">🪪 ${esc(a.cardNumber)} • Échéance ${esc(a.cardExpiry)}</div><div class="small">📍 ${a.sites.length? a.sites.map(id=>{const q=sitesData.find(x=>x.id===id);return q?esc(q.name+" — "+q.city):""}).filter(Boolean).join(", "):"Aucun site affecté"}</div><div class="row"><button class="outline" onclick="assignSubAgent(${a.id})">Affecter aux sites</button><button class="danger" onclick="removeSubAgent(${a.id})">Retirer</button></div></div>`).join(""):`<div class="item"><strong>Aucun agent enregistré</strong></div>`}</div>
 </div></div>`;
}
function sous(){
const can=canManage();
return `<div class="eyebrow">PARTENAIRES</div><div class="h1">Sous-traitants</div><div class="muted">Gérez les entreprises, leurs documents obligatoires et leurs agents affectables sur vos sites.</div>
${can?`<button class="primary" style="width:100%;margin-top:14px" onclick="openCreate('sub')">➕ CRÉER UN SOUS-TRAITANT</button>`:""}
<div class="section">${subcontractorsData.length} partenaire(s)</div><div class="list">${subcontractorsData.map((x,i)=>{
 const missing=SUB_DOCS.filter(d=>!subDocStatus(x.id,d)).length;
 const agents=subAgentsData.filter(a=>a.subId===x.id);
 return `<div class="item"><div class="itemtop"><strong>🤝 ${esc(x.name)}</strong><span class="badge ${missing?"warn":"ok"}">${missing?missing+" document(s) manquant(s)":"DOSSIER COMPLET"}</span></div><div class="small">${x.contact?esc(x.contact)+" • ":""}${agents.length} agent(s)</div><div class="small">${x.phone?"📞 "+esc(x.phone):"📞 Non renseigné"} • ${x.email?"✉️ "+esc(x.email):"✉️ Non renseigné"}</div>${can?`<div class="row"><button class="primary" onclick="openSubDetail(${i})">Ouvrir le dossier</button><button class="outline" onclick="editSub(${i})">Modifier</button><button class="danger" onclick="removeSub(${i})">Supprimer</button></div>`:""}</div>`}).join("")}</div>`}

function docs(){return `<div class="eyebrow">CONFORMITÉ</div><div class="h1">Documents & alertes</div><div class="card"><div>🔴 <b>1</b> document expiré</div><div style="margin-top:10px">🟠 <b>2</b> échéances à 30 jours</div><div style="margin-top:10px">🟢 <b>64</b> documents conformes</div></div><div class="section">Rappels automatiques</div><div class="list">${["Carte professionnelle CNAPS","MAC / recyclage","SST","Assurance sous-traitant"].map((x,i)=>`<div class="item"><strong>${x}</strong><div class="small">${i===0?"Alerte 30 jours • 60 jours • 90 jours":"Suivi d'échéance activé"}</div></div>`).join("")}</div>`}
function maincourante(){return `<div class="eyebrow">TRANSMISSIONS</div><div class="h1">Main courante</div><div class="card"><div class="title">Nouvelle transmission</div><div class="muted">Événement • Observation • Photo • Heure • Site • Agent</div><button class="primary" style="width:100%;margin-top:16px" onclick="toast('Formulaire de transmission ouvert')">NOUVELLE TRANSMISSION</button></div><div class="section">Dernières transmissions</div><div class="list"><div class="item"><strong>22:14 — Ronde effectuée</strong><div class="small">Centre commercial • Ahmed B.</div></div><div class="item"><strong>20:05 — Porte contrôlée</strong><div class="small">Entrepôt • Karim D.</div></div></div>`}
function incidents(){return `<div class="eyebrow">SÉCURITÉ</div><div class="h1">Incidents</div><div class="card"><div class="title">🚨 Déclarer un incident</div><div class="muted">Rapport, photos, localisation du site et transmission au responsable.</div><button class="danger" style="width:100%;margin-top:16px" onclick="toast('Déclaration d’incident ouverte')">SIGNALER UN INCIDENT</button></div><div class="section">Historique</div><div class="item"><strong>Incident #2026-018</strong><div class="small">Statut : en cours de traitement • Responsable notifié</div></div>`}
login();
</script>
