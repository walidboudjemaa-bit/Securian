<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060A12">
<title>SECURIAN — Prototype</title>
<style>
:root{--gold:#f3b51b;--navy:#102f68;--bg:#060a12;--card:#101722;--line:#1b2635;--text:#f7f9fc;--muted:#94a0b5;--ok:#65d89a;--danger:#ff6b6b;--warn:#ffc857}
*{box-sizing:border-box}body{margin:0;background:#03060b;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:82px}
.header{padding:16px 18px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(6,10,18,.96);backdrop-filter:blur(10px);z-index:10}
.logo{width:48px;height:48px;object-fit:contain}.brand{font-size:20px;font-weight:900;letter-spacing:2px}.tag{font-size:8px;color:#b7c0cf;letter-spacing:1px;margin-top:2px}
.content{padding:18px}.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:1.3px}.h1{font-size:27px;font-weight:850;margin:4px 0 4px}.muted{color:var(--muted);font-size:13px;line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px}.stat .num{font-size:27px;font-weight:900;margin:7px 0 2px}.stat .label{color:var(--muted);font-size:12px}
.section{font-size:18px;font-weight:800;margin:24px 0 10px}.card{margin-bottom:12px}.title{font-size:16px;font-weight:800;margin-bottom:5px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
button,.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:800;cursor:pointer}.primary{background:var(--gold);color:#07101e}.darkbtn{background:var(--navy);color:#fff}.outline{background:transparent;color:#fff;border:1px solid #3a4658}.danger{background:#5b1f27;color:#ffd9dd}.badge{padding:7px 9px;border-radius:8px;font-size:10px;font-weight:900}.ok{background:#173d2d;color:var(--ok)}.warn{background:#4b3a12;color:var(--warn)}.bad{background:#4b1d24;color:#ff8c95}
.list{display:flex;flex-direction:column;gap:9px}.item{background:#0c121c;border:1px solid var(--line);border-radius:13px;padding:13px}.itemtop{display:flex;justify-content:space-between;gap:10px}.item strong{font-size:14px}.small{font-size:12px;color:var(--muted);margin-top:4px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:rgba(9,14,23,.98);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.nav button{background:transparent;color:#aeb8c8;border-radius:0;padding:10px 4px 9px;font-size:10px}.nav button.active{color:var(--gold)}.nav .ico{font-size:19px;display:block;margin-bottom:3px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.loginbox{width:100%;max-width:390px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:25px;box-shadow:0 20px 60px #0008}.loginbox img{width:120px;height:120px;display:block;margin:0 auto 12px;object-fit:contain}.loginbox h1{text-align:center;margin:0 0 4px}.loginbox p{text-align:center;color:var(--muted);font-size:13px}.field{margin-top:14px}.field label{display:block;color:#c9d1df;font-size:12px;margin-bottom:6px}.field input,.field select{width:100%;padding:13px;border-radius:11px;border:1px solid #2b3748;background:#080d15;color:#fff;font-size:15px}.demo{margin-top:14px;font-size:11px;color:var(--muted);line-height:1.6}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#172333;border:1px solid #304057;padding:10px 14px;border-radius:12px;display:none;z-index:30;font-size:12px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="root"></div><div id="toast" class="toast"></div>
<script>
const logo="securian-logo.png";
const roles={
 direction:{label:"Direction",name:"Oualid",dash:true},
 cadre:{label:"Cadre / Responsable",name:"Responsable",dash:true},
 salarie:{label:"Salarié SECURIAN",name:"Ahmed",dash:false},
 sous:{label:"Responsable sous-traitant",name:"PROTECT PLUS",dash:false},
 agentext:{label:"Agent sous-traitant",name:"Mohamed",dash:false}
};
let state={role:"direction",screen:"dashboard"};
const icons={dashboard:"⌂",planning:"▣",pointage:"⌖",sites:"⌂",agents:"♙",sous:"♙",docs:"▤",main:"☷",incidents:"⚠"};

function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1800)}
function waze(q="Montpellier France"){location.href="https://waze.com/ul?q="+encodeURIComponent(q)+"&navigate=yes"}

function login(){
root.innerHTML=`<div class="login"><div class="loginbox">
<img src="${logo}"><h1>SECURIAN</h1><p>PROTÉGER • PRÉVENIR • PERFORMER</p>
<div class="field"><label>Profil de démonstration</label><select id="role">
<option value="direction">Direction</option><option value="cadre">Cadre / Responsable</option><option value="salarie">Salarié SECURIAN</option><option value="sous">Responsable sous-traitant</option><option value="agentext">Agent sous-traitant</option></select></div>
<div class="field"><label>Identifiant</label><input value="demo"></div>
<div class="field"><label>Mot de passe</label><input type="password" value="1234"></div>
<div class="row"><button class="primary" style="width:100%" onclick="doLogin()">SE CONNECTER</button></div>
<div class="demo">Compte démo : mot de passe <b>1234</b><br>Cette version est un prototype de test : aucune donnée réelle n'est envoyée.</div>
</div></div>`
}
function doLogin(){state.role=document.getElementById("role").value;state.screen=roles[state.role].dash?"dashboard":"planning";render()}
function navItems(){
let base=[["planning","Planning"],["pointage","Pointage"],["sites","Sites"]];
if(roles[state.role].dash) base.unshift(["dashboard","Accueil"]);
if(state.role==="direction"||state.role==="cadre"){base.push(["agents","Agents"],["sous","Sous-traitants"],["docs","Documents"],["incidents","Incidents"])}
else if(state.role==="sous"){base.push(["agents","Mes agents"],["docs","Documents"])}
else base.push(["main","Main courante"],["incidents","Incidents"]);
return base;
}
function render(){
const r=roles[state.role];
root.innerHTML=`<div class="app">
<header class="header"><img class="logo" src="${logo}"><div><div class="brand">SECURIAN</div><div class="tag">${r.label.toUpperCase()} • ${r.name}</div></div><button class="outline" style="margin-left:auto;padding:8px 10px;font-size:11px" onclick="login()">Quitter</button></header>
<main class="content">${screen()}</main>
<nav class="nav">${navItems().slice(0,5).map(([id,label])=>`<button class="${state.screen===id?'active':''}" onclick="go('${id}')"><span class="ico">${icons[id]||'•'}</span>${label}</button>`).join("")}</nav>
</div>`;
}
function go(s){state.screen=s;render()}
function screen(){
switch(state.screen){
case"dashboard":return dashboard();
case"planning":return planning();
case"pointage":return pointage();
case"sites":return sites();
case"agents":return agents();
case"sous":return sous();
case"docs":return docs();
case"main":return maincourante();
case"incidents":return incidents();
default:return planning()
}}
function dashboard(){return `<div class="eyebrow">TABLEAU DE BORD</div><div class="h1">Bonjour ${roles[state.role].name} 👋</div><div class="muted">Vue opérationnelle SECURIAN</div>
<div class="grid"><div class="stat"><div>👮</div><div class="num">42</div><div class="label">Agents</div></div><div class="stat"><div>🏢</div><div class="num">18</div><div class="label">Sites</div></div><div class="stat"><div>🟢</div><div class="num">35</div><div class="label">En service</div></div><div class="stat"><div>🪪</div><div class="num">3</div><div class="label">Documents à renouveler</div></div></div>
<div class="section">Service en cours</div><div class="card"><div class="title">Centre commercial — Montpellier</div><div class="muted">Ahmed B. • SECURIAN • 18:00 → 06:00</div><div class="row"><button class="darkbtn" onclick="waze('Centre commercial Montpellier')">🧭 Ouvrir Waze</button><span class="badge ok">POINTAGE OK</span></div></div>
<div class="section">Alertes</div><div class="card"><div>🔴 1 carte professionnelle expirée</div><div style="margin-top:9px">🟠 2 habilitations à renouveler sous 30 jours</div><div style="margin-top:9px">⚠️ 2 anomalies de pointage</div></div>`}
function planning(){return `<div class="eyebrow">ORGANISATION</div><div class="h1">Planning</div><div class="muted">Services, affectations et remplacements.</div><div class="section">Aujourd'hui — 19 août</div><div class="list">
${["18:00–06:00 • Centre commercial • Ahmed B. — SECURIAN","06:00–18:00 • Entrepôt • Karim D. — SECURIAN","18:00–06:00 • Hôtel • Mohamed — PROTECT PLUS"].map(x=>`<div class="item"><strong>${x}</strong><div class="small">Affectation • Consignes • Pointage</div></div>`).join("")}</div>
<div class="card" style="margin-top:14px"><div class="title">🔄 Besoin d'un remplaçant ?</div><div class="muted">Recherche par disponibilité, qualification, validité des documents et proximité.</div><button class="primary" style="margin-top:12px" onclick="toast('Recherche de remplaçants lancée')">RECHERCHER</button></div>`}
function pointage(){return `<div class="eyebrow">PRÉSENCE</div><div class="h1">Pointage</div><div class="card"><div style="font-size:38px">📍</div><div class="title">Centre commercial — Montpellier</div><div class="muted">La géolocalisation est utilisée uniquement pour le pointage et le service.</div><button class="primary" style="width:100%;margin-top:18px" onclick="toast('Service démarré • position enregistrée')">DÉMARRER MON SERVICE</button><button class="outline" style="width:100%;margin-top:9px" onclick="toast('Service terminé • pointage enregistré')">TERMINER MON SERVICE</button><button class="darkbtn" style="width:100%;margin-top:9px" onclick="waze('Centre commercial Montpellier')">🧭 ITINÉRAIRE WAZE</button></div>`}
function sites(){return `<div class="eyebrow">OPÉRATIONS</div><div class="h1">Sites</div><div class="list">${["Centre commercial — Montpellier","Entrepôt — Sète","Hôtel — Béziers"].map(x=>`<div class="item"><div class="itemtop"><strong>${x}</strong><span class="badge ok">ACTIF</span></div><div class="small">Consignes • Planning • Agents affectés</div><div class="row"><button class="darkbtn" onclick="waze('${x}')">🧭 Waze</button><button class="outline" onclick="toast('Consignes ouvertes')">Consignes</button></div></div>`).join("")}</div>`}
function agents(){return `<div class="eyebrow">RESSOURCES HUMAINES</div><div class="h1">${state.role==="sous"?"Mes agents":"Agents"}</div><div class="list">${["Ahmed B.","Karim D.","Sofiane M.","Mohamed — PROTECT PLUS"].map((x,i)=>`<div class="item"><div class="itemtop"><strong>${x}</strong><span class="badge ${i===1?'warn':'ok'}">${i===1?'28 JOURS':'VALIDE'}</span></div><div class="small">Carte pro • Formations • Planning • Sites autorisés</div></div>`).join("")}</div>`}
function sous(){return `<div class="eyebrow">PARTENAIRES</div><div class="h1">Sous-traitants</div><div class="list">${["PROTECT PLUS — 8 agents","SECURITY PARTNER — 5 agents","SUD PROTECTION — 11 agents"].map((x,i)=>`<div class="item"><div class="itemtop"><strong>${x}</strong><span class="badge ${i===2?'warn':'ok'}">${i===2?'ÉCHÉANCE':'ACTIF'}</span></div><div class="small">Contrat • Assurances • Documents • Agents • Sites</div></div>`).join("")}</div>`}
function docs(){return `<div class="eyebrow">CONFORMITÉ</div><div class="h1">Documents & alertes</div><div class="card"><div>🔴 <b>1</b> document expiré</div><div style="margin-top:10px">🟠 <b>2</b> échéances à 30 jours</div><div style="margin-top:10px">🟢 <b>64</b> documents conformes</div></div><div class="section">Rappels automatiques</div><div class="list">${["Carte professionnelle CNAPS","MAC / recyclage","SST","Assurance sous-traitant"].map((x,i)=>`<div class="item"><strong>${x}</strong><div class="small">${i===0?"Alerte 30 jours • 60 jours • 90 jours":"Suivi d'échéance activé"}</div></div>`).join("")}</div>`}
function maincourante(){return `<div class="eyebrow">TRANSMISSIONS</div><div class="h1">Main courante</div><div class="card"><div class="title">Nouvelle transmission</div><div class="muted">Événement • Observation • Photo • Heure • Site • Agent</div><button class="primary" style="width:100%;margin-top:16px" onclick="toast('Formulaire de transmission ouvert')">NOUVELLE TRANSMISSION</button></div><div class="section">Dernières transmissions</div><div class="list"><div class="item"><strong>22:14 — Ronde effectuée</strong><div class="small">Centre commercial • Ahmed B.</div></div><div class="item"><strong>20:05 — Porte contrôlée</strong><div class="small">Entrepôt • Karim D.</div></div></div>`}
function incidents(){return `<div class="eyebrow">SÉCURITÉ</div><div class="h1">Incidents</div><div class="card"><div class="title">🚨 Déclarer un incident</div><div class="muted">Rapport, photos, localisation du site et transmission au responsable.</div><button class="danger" style="width:100%;margin-top:16px" onclick="toast('Déclaration d’incident ouverte')">SIGNALER UN INCIDENT</button></div><div class="section">Historique</div><div class="item"><strong>Incident #2026-018</strong><div class="small">Statut : en cours de traitement • Responsable notifié</div></div>`}
login();
</script>
</body></html>
